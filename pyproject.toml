[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sniplingo"
version = "0.1.0"
description = "Game screen overlay translator (English -> Japanese) for Windows 11"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "mss>=9.0",
    "Pillow>=10.0",
    "pynput>=1.7",
    "deep-translator>=1.11",
    "winrt-Windows.Media.Ocr>=3.2.1",
    "winrt-Windows.Graphics.Imaging>=3.2.1",
    "winrt-Windows.Storage.Streams>=3.2.1",
    "winrt-Windows.Globalization>=3.2.1",
    "winrt-Windows.Foundation>=3.2.1",
    # Needed to iterate OCR result collections (IVectorView of lines/words).
    "winrt-Windows.Foundation.Collections>=3.2.1",
]

[project.optional-dependencies]
# Heavy offline NMT fallback. Installed on demand: pip install -e ".[offline]"
offline = ["argostranslate>=1.9"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
sniplingo = "sniplingo.ui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sniplingo"]

[tool.pytest.ini_options]
# Default `pytest` run = fast unit tests only. Integration tests are opt-in:
#   pytest tests/integration -m "windows_ocr or network or display or qt"
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "windows_ocr: requires the Windows OCR engine and an installed English language pack",
    "network: requires network access (deep-translator / Google free endpoint)",
    "display: requires a display / desktop session (mss capture)",
    "qt: requires a Qt environment (pytest-qt)",
]

[tool.coverage.run]
source = ["sniplingo"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
